<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deals - CampusBite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container page">
    <h1>Deals</h1>
    <p class="page-sub">Combo deals from every canteen. Compare them side by side to find the best value. The discount applies automatically in your cart.</p>

    <div class="filters" style="margin-bottom:1.2rem">
      <div class="filter-group">
        <h3>Canteen</h3>
        <div class="pill-row" id="dealCanteenFilters"></div>
      </div>
    </div>

    <div class="grid deal-grid" id="dealList"></div>

    <section class="section" aria-live="polite" id="compareBox"></section>

    <section class="section">
      <h2>Same food, different canteen</h2>
      <p class="page-sub" style="margin-top:0">A quick price check across canteens.</p>
      <div class="price-check" id="priceCheck"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/deals.js"></script>
</body>
</html>
