erts\",     price: 60,  veg: true,  emoji: \"\ud83c\udf69\", available: true, popular: false, description: \"Soft glazed donut with a chocolate topping.\" },\n  { id: 17, name: \"Cake\",            canteen: \"Tango\", category: \"Desserts\",     price: 80,  veg: true,  emoji: \"\ud83c\udf70\", available: true, popular: false, description: \"A soft slice of chocolate cake.\" },\n\n  // ----- MUNCH -----\n  { id: 18, name: \"Veg Fried Rice\",       canteen: \"Munch\", category: \"Chinese\", price: 90,  veg: true,  emoji: \"\ud83c\udf5a\", available: true, popular: false, description: \"Classic fried rice with carrots, beans and cabbage.\" },\n  { id: 19, name: \"Chicken Fried Rice\",   canteen: \"Munch\", category: \"Chinese\", price: 120, veg: false, emoji: \"\ud83c\udf57\", available: true, popular: false, description: \"Fried rice tossed with juicy chicken pieces and egg.\" },\n  { id: 20, name: \"Schezwan Fried Rice\",  canteen: \"Munch\", category: \"Chinese\", price: 110, veg: true,  emoji: \"\ud83c\udf36\ufe0f\", available: true, popular: false, description: \"Spicy fried rice cooked in fiery Schezwan sauce.\" },\n  { id: 21, name: \"Veg Noodles\",          canteen: \"Munch\", category: \"Chinese\", price: 90,  veg: true,  emoji: \"\ud83c\udf5c\", available: true, popular: false, description: \"Hakka-style noodles with fresh vegetables.\" },\n  { id: 22, name: \"Schezwan Noodles\",     canteen: \"Munch\", category: \"Chinese\", price: 100, veg: true,  emoji: \"\ud83e\udd61\", available: true, popular: true,  description: \"Hot and spicy noodles in tangy Schezwan sauce.\" },\n  { id: 23, name: \"Gobi Manchurian\",      canteen: \"Munch\", category: \"Chinese\", price: 90,  veg: true,  emoji: \"\ud83e\udd66\", available: true, popular: true,  description: \"Crispy cauliflower tossed in a sweet-spicy Manchurian sauce.\" },\n  { id: 24, name: \"Paneer Manchurian\",    canteen: \"Munch\", category: \"Chinese\", price: 110, veg: true,  emoji: \"\ud83e\udd58\", available: true, popular: false, description: \"Paneer cubes in a rich, garlicky Manchurian gravy.\" }\n];\n\n// ---------- 3. ORDER STATUSES (in order) ----------\nconst ORDER_STATUSES = [\n  { name: \"Order Placed\",     icon: \"\ud83d\udfe1\" },\n  { name: \"Preparing\",        icon: \"\ud83d\udfe0\" },\n  { name: \"Ready for Pickup\", icon: \"\ud83d\udfe2\" },\n  { name: \"Out for Delivery\", icon: \"\ud83d\udef5\" },   // delivery orders only\n  { name: \"Completed\",        icon: \"\ud83d\udd35\" }\n];\n\n// ---------- 4. LOCALSTORAGE KEYS ----------\nconst KEYS = {\n  cart: \"campusbite_cart\",                 // [{ id, qty }]\n  orders: \"campusbite_orders\",             // [ order, order, ... ]\n  availability: \"campusbite_availability\", // { foodId: true/false }\n  lastNumber: \"campusbite_last_order_no\",  // 1024, 1025, ...\n  dashboardCanteen: \"campusbite_dashboard_canteen\",\n  rider: \"campusbite_rider\"                // rider chosen in the Delivery Partner app\n};\n\n// ---------- 5. SMALL HELPERS ----------\n// ---- Saving data ----\n// Everything is saved in localStorage so it survives a refresh. But some browsers do not\n// share localStorage between pages (Safari/Firefox opening files directly) or block it\n// completely (private mode, embedded pages). Then the cart would look empty on the next page.\n// So every save is ALSO copied into window.name, which travels with the browser tab from\n// page to page. When loading, whichever copy is newer wins.\nlet storageWorks = true;\ntry {\n  localStorage.setItem(\"campusbite_test\", \"1\");\n  localStorage.removeItem(\"campusbite_test\");\n} catch (error) {\n  storageWorks = false;\n}\n\n// { key: { t: time saved, v: text or null } }\n// In the single-file edition (CampusBite-single-file.html) the pages live inside one parent page,\n// so they all share one copy kept in the parent. Otherwise the copy comes from window.name.\nlet backup = null;\ntry {\n  if (window.parent !== window && window.parent.__campusbiteMemory) backup = window.parent.__campusbiteMemory;\n} catch (error) {\n  backup = null;\n}\nif (!backup) {\n  backup = {};\n  try {\n    if (window.name.indexOf('{\"campusbite_') === 0) backup = JSON.parse(window.name);\n  } catch (error) {\n    backup = {};\n  }\n}\n\n// What does localStorage hold for this key (and when was it saved)?\nfunction fromLocalStorage(key) {\n  if (!storageWorks) return { t: 0, v: null };\n  try {\n    return { t: Number(localStorage.getItem(key + \"__t\")) || 0, v: localStorage.getItem(key) };\n  } catch (error) {\n    return { t: 0, v: null };\n  }\n}\n\n// Write text (or null = delete) to both places\nfunction writeSaved(key, text) {\n  const time = Date.now();\n  if (storageWorks) {\n    try {\n      if (text === null) localStorage.removeItem(key); else localStorage.setItem(key, text);\n      localStorage.setItem(key + \"__t\", time);\n    } catch (error) { /* ignore: the tab copy below still works */ }\n  }\n  backup[key] = { t: time, v: text };\n  try { window.name = JSON.stringify(backup); } catch (error) { /* ignore */ }\n}\n\n// Read something (returns fallback if nothing is saved yet)\nfunction load(key, fallback) {\n  try {\n    const local = fromLocalStorage(key);\n    const copy = backup[key];\n    let raw = local.v;\n    if (copy && copy.t > local.t) {          // the tab's copy is newer\n      raw = copy.v;\n      if (storageWorks) {                     // bring this page's localStorage up to date\n        try {\n          if (copy.v === null) localStorage.removeItem(key); else localStorage.setItem(key, copy.v);\n          localStorage.setItem(key + \"__t\", copy.t);\n        } catch (error) { /* ignore */ }\n      }\n    }\n    return raw ? JSON.parse(raw) : fallback;\n  } catch (error) {\n    return fallback;\n  }\n}\n\n// Save something (objects/arrays are turned into text first)\nfunction save(key, value) {\n  writeSaved(key, JSON.stringify(value));\n}\n\n// Delete one saved item\nfunction removeSaved(key) {\n  writeSaved(key, null);\n}\n\n// Find a canteen by its name\nfunction getCanteen(name) {\n  return canteens.find(function (c) { return c.name === name; });\n}\n\n// Find a food by its id\nfunction getFood(id) {\n  return foods.find(function (f) { return f.id === Number(id); });\n}\n\n// Is this food available? A saved choice from the dashboard wins over the default.\nfunction isAvailable(food) {\n  const saved = load(KEYS.availability, {});\n  return saved[food.id] !== undefined ? saved[food.id] : food.available;\n}\n\n// Used by the canteen dashboard: switch Available <-> Sold Out\nfunction toggleAvailability(foodId) {\n  const food = getFood(foodId);\n  const saved = load(KEYS.availability, {});\n  saved[food.id] = !isAvailable(food);\n  save(KEYS.availability, saved);\n}\n\n// Position of a status in the list (0 = Order Placed ... 3 = Completed)\nfunction statusIndex(statusName) {\n  return ORDER_STATUSES.findIndex(function (s) { return s.name === statusName; });\n}\n\n\n// ---------- 6. SETTINGS (change these to tune the demo) ----------\nconst ADDON_WINDOW_SECONDS = 120;   // time to add extra items after paying (2 minutes)\nconst DELIVERY_FEE = 15;            // rupees\nconst DEMO_DELIVERY_SECONDS = 60;   // how long the simulated ride takes on screen\n                                    // (for a \"real\" feel use: spot.minutes * 60)\n\n// ---------- 7. CAMPUS MAP: delivery points + delivery partners ----------\nconst campusSpots = [\n  { name: \"Hostel A\",       x: 70,  y: 310, minutes: 7 },\n  { name: \"Hostel B\",       x: 180, y: 330, minutes: 6 },\n  { name: \"Library\",        x: 295, y: 300, minutes: 4 },\n  { name: \"Main Block\",     x: 410, y: 330, minutes: 3 },\n  { name: \"Sports Complex\", x: 525, y: 300, minutes: 6 }\n];\n\nconst riders = [\n  { id: \"r1\", name: \"Ravi Kumar\",  initials: \"RK\", rating: 4.8, vehicle: \"Bike\" },\n  { id: \"r2\", name: \"Suresh M\",    initials: \"SM\", rating: 4.6, vehicle: \"Scooter\" },\n  { id: \"r3\", name: \"Anita S\",     initials: \"AS\", rating: 4.9, vehicle: \"Bike\" }\n];\n\n// ---------- 8. DEALS (combos) ----------\n// A deal is a set of foods from ONE canteen sold together for a lower price.\n// The discount is applied automatically when the cart contains all the items of a deal.\nconst DEALS = [\n  { id: \"d1\", name: \"Breakfast Combo\",      canteen: \"Udupi\", price: 80,  items: [{ id: 1, qty: 2 }, { id: 2, qty: 1 }, { id: 6, qty: 1 }] },\n  { id: \"d2\", name: \"Dosa & Chai\",          canteen: \"Udupi\", price: 55,  items: [{ id: 3, qty: 1 }, { id: 6, qty: 1 }] },\n  { id: \"d3\", name: \"Snack Break\",          canteen: \"Udupi\", price: 60,  items: [{ id: 7, qty: 2 }, { id: 9, qty: 1 }] },\n  { id: \"d4\", name: \"Biryani + Donut\",      canteen: \"Tango\", price: 175, items: [{ id: 11, qty: 1 }, { id: 16, qty: 1 }] },\n  { id: \"d5\", name: \"Veg Feast\",            canteen: \"Tango\", price: 170, items: [{ id: 10, qty: 1 }, { id: 17, qty: 1 }] },\n  { id: \"d6\", name: \"Pizza Duo\",            canteen: \"Tango\", price: 230, items: [{ id: 12, qty: 2 }] },\n  { id: \"d7\", name: \"Noodles & Manchurian\", canteen: \"Munch\", price: 150, items: [{ id: 21, qty: 1 }, { id: 23, qty: 1 }] },\n  { id: \"d8\", name: \"Schezwan Special\",     canteen: \"Munch\", price: 175, items: [{ id: 20, qty: 1 }, { id: 22, qty: 1 }] },\n  { id: \"d9\", name: \"Rice Bowl Combo\",      canteen: \"Munch\", price: 165, items: [{ id: 18, qty: 1 }, { id: 24, qty: 1 }] }\n];\n\n// Same kind of food sold in two canteens (for the price check on the Deals page)\nconst COMPARE_FOODS = [\n  { label: \"Veg fried rice\", ids: [13, 18] },\n  { label: \"Veg noodles\",    ids: [14, 21] }\n];\n\nfunction dealRegularPrice(deal) {\n  return deal.items.reduce(function (sum, i) { return sum + getFood(i.id).price * i.qty; }, 0);\n}\nfunction dealSaving(deal) { return dealRegularPrice(deal) - deal.price; }\nfunction dealItemCount(deal) { return deal.items.reduce(function (n, i) { return n + i.qty; }, 0); }\n// Returns the first sold-out food in the deal, or null if everything is available\nfunction dealSoldOutFood(deal) {\n  for (let i = 0; i < deal.items.length; i++) {\n    const food = getFood(deal.items[i].id);\n    if (!isAvailable(food)) return food;\n  }\n  return null;\n}\n\n// ---------- 9. ORDER HELPERS ----------\nfunction isDelivery(order) { return order.mode === \"delivery\"; }\n\n// Which statuses does this order go through? (indexes into ORDER_STATUSES)\nfunction statusFlow(order) { return isDelivery(order) ? [0, 1, 2, 3, 4] : [0, 1, 2, 4]; }\n\n// Delivery orders use slightly different words for two statuses\nfunction statusLabel(order, statusName) {\n  if (isDelivery(order)) {\n    if (statusName === \"Ready for Pickup\") return \"Ready for Rider\";\n    if (statusName === \"Completed\") return \"Delivered\";\n  }\n  return statusName;\n}\n\n// Total paid for an order = first payment + every add-on payment\nfunction grandTotal(order) {\n  return order.total + (order.addOns || []).reduce(function (sum, a) { return sum + a.amount; }, 0);\n}\n\n// Can the student still add items? Only for 2 minutes, and only before the kitchen finishes.\nfunction addonState(order) {\n  const left = Math.max(0, Math.ceil(((order.addonUntil || 0) - Date.now()) / 1000));\n  const kitchenOpen = statusIndex(order.status) <= 1;   // Order Placed or Preparing\n  return { open: left > 0 && kitchenOpen, left: left, reason: left <= 0 ? \"time\" : (kitchenOpen ? \"\" : \"kitchen\") };\n}\n\n// A short description of how saving works (shown in the \"Having trouble?\" box on the Cart page)\nfunction storageReport() {\n  return (storageWorks ? \"browser storage is working\" : \"browser storage is blocked, using the tab copy\") +\n    \"; \" + load(KEYS.cart, []).length + \" item(s) saved in the cart\";\n}\n\n<\/script>\n  <script>\n// =====================================================\n// common.js  -  code shared by every page\n// (navbar, footer, cart + deals, reorder, food card, toast, countdowns)\n// =====================================================\n\n// ---------- Small helpers ----------\nfunction rupees(amount) {\n  return \"\u20b9\" + amount;\n}\n\nfunction formatDate(isoString) {\n  return new Date(isoString).toLocaleString(\"en-IN\", {\n    day: \"numeric\", month: \"short\", hour: \"numeric\", minute: \"2-digit\"\n  });\n}\n\n// 107 seconds -> \"1:47\"\nfunction formatClock(totalSeconds) {\n  const minutes = Math.floor(totalSeconds / 60);\n  const seconds = totalSeconds % 60;\n  return minutes + \":\" + String(seconds).padStart(2, \"0\");\n}\n\n// ---------- Cart (saved in localStorage) ----------\nfunction getCart() {\n  return load(KEYS.cart, []);\n}\n\nfunction saveCart(cart) {\n  save(KEYS.cart, cart);\n  updateCartBadge();\n}\n\n// Cart items together with the full food details: [{ food, qty }]\nfunction getCartItems() {\n  return getCart()\n    .map(function (item) { return { food: getFood(item.id), qty: item.qty }; })\n    .filter(function (item) { return item.food; });\n}\n\n// Works out subtotal, deal discount and total for a list of cart items from ONE canteen.\n// A deal applies when the list holds ALL its items (as many times as the quantities allow).\nfunction pricingFor(items) {\n  const subtotal = items.reduce(function (sum, i) { return sum + i.food.price * i.qty; }, 0);\n\n  const left = {};   // how many of each food are still \"unused\" by a deal\n  items.forEach(function (i) { left[i.food.id] = i.qty; });\n\n  const canteen = items.length ? items[0].food.canteen : null;\n  let discount = 0;\n  const applied = [];\n\n  DEALS\n    .filter(function (d) { return d.canteen === canteen; })\n    .sort(function (a, b) { return dealSaving(b) - dealSaving(a); })   // biggest saving first\n    .forEach(function (deal) {\n      let times = Infinity;\n      deal.items.forEach(function (it) {\n        times = Math.min(times, Math.floor((left[it.id] || 0) / it.qty));\n      });\n      if (times > 0 && times !== Infinity) {\n        deal.items.forEach(function (it) { left[it.id] -= it.qty * times; });\n        discount += dealSaving(deal) * times;\n        applied.push({ deal: deal, times: times, saving: dealSaving(deal) * times });\n      }\n    });\n\n  return { subtotal: subtotal, discount: discount, applied: applied, total: subtotal - discount };\n}\n\n// The cart split by canteen: [{ canteen, items, pricing }]\n// Food from different canteens becomes separate orders at checkout.\nfunction getCartGroups() {\n  const groups = [];\n  getCartItems().forEach(function (item) {\n    let group = groups.find(function (g) { return g.canteen === item.food.canteen; });\n    if (!group) {\n      group = { canteen: item.food.canteen, items: [] };\n      groups.push(group);\n    }\n    group.items.push(item);\n  });\n  groups.forEach(function (g) { g.pricing = pricingFor(g.items); });\n  return groups;\n}\n\n// Whole-cart totals (all canteens together)\nfunction getCartPricing() {\n  const total = { subtotal: 0, discount: 0, applied: [], total: 0 };\n  getCartGroups().forEach(function (g) {\n    total.subtotal += g.pricing.subtotal;\n    total.discount += g.pricing.discount;\n    total.total += g.pricing.total;\n    total.applied = total.applied.concat(g.pricing.applied);\n  });\n  return total;\n}\n\nfunction updateCartBadge() {\n  const badge = document.getElementById(\"cartBadge\");\n  if (!badge) return;\n  const count = getCart().reduce(function (sum, item) { return sum + item.qty; }, 0);\n  badge.textContent = count;\n  badge.style.display = count > 0 ? \"inline-block\" : \"none\";\n}\n\n// Add one or more foods to the cart. list = [{ id, qty }]. Returns true if something was added.\n// options.skipSoldOut: skip sold-out items instead of refusing (used by Reorder)\nfunction addItemsToCart(list, options) {\n  options = options || {};\n  let wanted = list\n    .map(function (i) { return { food: getFood(i.id), qty: i.qty }; })\n    .filter(function (i) { return i.food; });\n  if (wanted.length === 0) return false;\n\n  const soldOut = wanted.filter(function (i) { return !isAvailable(i.food); });\n  let skippedNote = \"\";\n  if (soldOut.length > 0) {\n    if (!options.skipSoldOut) {\n      toast(soldOut[0].food.name + \" is sold out right now\");\n      return false;\n    }\n    wanted = wanted.filter(function (i) { return isAvailable(i.food); });\n    if (wanted.length === 0) {\n      toast(\"Everything in that order is sold out right now\");\n      return false;\n    }\n    skippedNote = \" (\" + soldOut.map(function (i) { return i.food.name; }).join(\", \") + \" sold out, skipped)\";\n  }\n\n  const cart = getCart();   // food from several canteens can sit in one cart\n\n  wanted.forEach(function (w) {\n    const existing = cart.find(function (item) { return item.id === w.food.id; });\n    if (existing) {\n      existing.qty = Math.min(existing.qty + w.qty, 10);   // max 10 of one item\n    } else {\n      cart.push({ id: w.food.id, qty: Math.min(w.qty, 10) });\n    }\n  });\n  saveCart(cart);\n\n  if (options.message) {\n    toast(options.message + skippedNote);\n  } else if (wanted.length === 1) {\n    toast((wanted[0].qty > 1 ? wanted[0].qty + \" \u00d7 \" : \"\") + wanted[0].food.name + \" added to cart\");\n  } else {\n    toast(wanted.length + \" items added to cart\" + skippedNote);\n  }\n  return true;\n}\n\nfunction addToCart(foodId, qty) {\n  return addItemsToCart([{ id: foodId, qty: qty || 1 }]);\n}\n\nfunction addDealToCart(dealId) {\n  const deal = DEALS.find(function (d) { return d.id === dealId; });\n  if (!deal) return false;\n  const soldOut = dealSoldOutFood(deal);\n  if (soldOut) {\n    toast(deal.name + \" is unavailable: \" + soldOut.name + \" is sold out\");\n    return false;\n  }\n  return addItemsToCart(deal.items, { message: deal.name + \" added. The deal price applies in your cart.\" });\n}\n\n// ---------- Orders (saved in localStorage) ----------\nfunction getOrders() {\n  return load(KEYS.orders, []);\n}\n\nfunction saveOrders(orders) {\n  save(KEYS.orders, orders);\n}\n\n// Every item of an order: the original items first, then add-on items (marked later: true)\nfunction orderItemsFlat(order) {\n  const list = order.items.map(function (i) { return Object.assign({}, i, { later: false }); });\n  (order.addOns || []).forEach(function (addOn) {\n    addOn.items.forEach(function (i) { list.push(Object.assign({}, i, { later: true })); });\n  });\n  return list;\n}\n\n// Orders saved by an older version have no food id, so fall back to matching by name\nfunction itemFoodId(item, order) {\n  if (item.id) return item.id;\n  const food = foods.find(function (f) { return f.name === item.name && f.canteen === order.canteen; });\n  return food ? food.id : null;\n}\n\n// Reorder: put the same items back in the cart\nfunction reorderOrder(orderId) {\n  const order = getOrders().find(function (o) { return o.id === orderId; });\n  if (!order) return false;\n  const list = orderItemsFlat(order)\n    .map(function (i) { return { id: itemFoodId(i, order), qty: i.qty }; })\n    .filter(function (i) { return i.id; });\n  return addItemsToCart(list, { skipSoldOut: true, message: \"Order \" + order.id + \" added to cart\" });\n}\n\n// ---------- Small pieces of HTML used on several pages ----------\nfunction statusChipHTML(order) {\n  const index = statusIndex(order.status);\n  return '<span class=\"chip status-' + index + '\">' + ORDER_STATUSES[index].icon + \" \" + statusLabel(order, order.status) + \"<\/span>\";\n}\n\nfunction vegDotHTML(food) {\n  const label = food.veg ? \"Vegetarian\" : \"Non-vegetarian\";\n  return '<span class=\"veg-dot ' + (food.veg ? \"veg\" : \"nonveg\") + '\" title=\"' + label + '\" role=\"img\" aria-label=\"' + label + '\"><\/span>';\n}\n\n// One food card (Home, Menu, Cart). \"reason\" is optional: the small \"why we picked it\" tag.\nfunction foodCardHTML(food, reason) {\n  const soldOut = !isAvailable(food);\n  const button = soldOut\n    ? '<button class=\"btn btn-small\" disabled>Sold Out<\/button>'\n    : '<button class=\"btn btn-small\" data-add=\"' + food.id + '\">Add to Cart<\/button>';\n\n  return `\n    <article class=\"food-card ${soldOut ? \"is-sold-out\" : \"\"}\">\n      <a class=\"food-img tile-${food.canteen.toLowerCase()}\" href=\"food.html?id=${food.id}\" aria-label=\"View ${food.name}\">\n        <span>${food.emoji}<\/span>\n        ${soldOut ? '<em class=\"sold-badge\">Sold Out<\/em>' : \"\"}\n      <\/a>\n      <div class=\"food-body\">\n        <div class=\"food-top\">\n          <h3><a href=\"food.html?id=${food.id}\">${food.name}<\/a><\/h3>\n          ${vegDotHTML(food)}\n        <\/div>\n        <p class=\"muted\">${food.canteen}<\/p>\n        ${reason ? '<p class=\"reason\">\u2728 ' + reason + \"<\/p>\" : \"\"}\n        <div class=\"food-bottom\">\n          <strong class=\"price\">${rupees(food.price)}<\/strong>\n          ${button}\n        <\/div>\n      <\/div>\n    <\/article>`;\n}\n\n// ---------- Toast (small pop-up message) ----------\nlet toastTimer;\nfunction toast(message) {\n  let el = document.getElementById(\"toast\");\n  if (!el) {\n    el = document.createElement(\"div\");\n    el.id = \"toast\";\n    el.className = \"toast\";\n    el.setAttribute(\"role\", \"status\");\n    document.body.appendChild(el);\n  }\n  el.textContent = message;\n  el.classList.add(\"show\");\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(function () { el.classList.remove(\"show\"); }, 2600);\n}\n\n// ---------- Countdown clocks ----------\n// Any element like <b data-until=\"1767225600000\"><\/b> becomes a live m:ss clock.\n// onExpire(element) is called once when a clock reaches 0:00.\nfunction startCountdowns(onExpire) {\n  function tick() {\n    document.querySelectorAll(\"[data-until]\").forEach(function (el) {\n      const left = Math.max(0, Math.ceil((Number(el.dataset.until) - Date.now()) / 1000));\n      el.textContent = formatClock(left);\n      if (left === 0 && !el.dataset.done) {\n        el.dataset.done = \"1\";\n        if (onExpire) onExpire(el);\n      }\n    });\n  }\n  tick();\n  return setInterval(tick, 1000);\n}\n\n// ---------- Navbar + Footer (written once, shown on every page) ----------\nfunction renderNavbar() {\n  const holder = document.getElementById(\"navbar\");\n  if (!holder) return;\n\n  const page = window.__page;\n  // Sub-pages highlight their parent link\n  const parent = {\n    \"food.html\": \"menu.html\", \"checkout.html\": \"cart.html\",\n    \"confirmation.html\": \"orders.html\", \"addon.html\": \"orders.html\", \"track.html\": \"orders.html\"\n  };\n  const current = parent[page] || page;\n\n  const links = [\n    [\"index.html\", \"Home\"],\n    [\"menu.html\", \"Menu\"],\n    [\"deals.html\", \"Deals\"],\n    [\"orders.html\", \"My Orders\"],\n    [\"cart.html\", \"Cart\"],\n    [\"dashboard.html\", \"Canteen Dashboard\"]\n  ];\n\n  const linksHTML = links.map(function (link) {\n    const badge = link[0] === \"cart.html\" ? '<span class=\"cart-badge\" id=\"cartBadge\">0<\/span>' : \"\";\n    const active = link[0] === current ? 'class=\"active\" aria-current=\"page\"' : \"\";\n    return '<a href=\"' + link[0] + '\" ' + active + \">\" + link[1] + badge + \"<\/a>\";\n  }).join(\"\");\n\n  holder.innerHTML = `\n    <header class=\"navbar\">\n      <div class=\"container nav-inner\">\n        <a class=\"brand\" href=\"index.html\"><span>\ud83c\udf54<\/span> CampusBite<\/a>\n        <button class=\"nav-toggle\" id=\"navToggle\" aria-label=\"Open menu\" aria-expanded=\"false\">\u2630<\/button>\n        <nav class=\"nav-links\" id=\"navLinks\">${linksHTML}<\/nav>\n      <\/div>\n    <\/header>`;\n\n  // Hamburger button on mobile\n  const toggle = document.getElementById(\"navToggle\");\n  const nav = document.getElementById(\"navLinks\");\n  toggle.addEventListener(\"click\", function () {\n    const open = nav.classList.toggle(\"open\");\n    toggle.setAttribute(\"aria-expanded\", open);\n  });\n}\n\nfunction renderFooter() {\n  const holder = document.getElementById(\"footer\");\n  if (!holder) return;\n  holder.innerHTML = `\n    <footer class=\"footer\">\n      <div class=\"container footer-inner\">\n        <span>\ud83c\udf54 CampusBite &ndash; Hungry? Skip the queue.${storageWorks ? \"\" : \" (Your browser blocks saving, so data resets when this tab closes.)\"}<\/span>\n        <span class=\"footer-links\"><a href=\"about.html\">About<\/a><a href=\"delivery.html\">Delivery Partner app<\/a><\/span>\n      <\/div>\n    <\/footer>`;\n}\n\n// Firefox keeps a separate storage for every file opened directly from disk, so the cart can look\n// empty on the next page. Point those users to the single-file edition.\nfunction renderFirefoxNotice() {\n  const direct = location.protocol === \"file:\" && window.parent === window;\n  if (!direct || navigator.userAgent.indexOf(\"Firefox\") === -1) return;\n  const bar = document.createElement(\"div\");\n  bar.className = \"notice-bar\";\n  bar.innerHTML = 'Firefox does not share saved data between files opened directly, so your cart may look empty. ' +\n    '<a href=\"CampusBite-single-file.html\">Open the single-file version<\/a> or run a local server (see README).';\n  document.body.insertBefore(bar, document.body.firstChild);\n}\n\n// ---------- Run on every page ----------\nrenderFirefoxNotice();\nrenderNavbar();\nrenderFooter();\nupdateCartBadge();\n\n// Buttons with data-add=\"foodId\", data-deal=\"dealId\" or data-reorder=\"orderId\" work on every page\ndocument.addEventListener(\"click\", function (event) {\n  const addButton = event.target.closest(\"[data-add]\");\n  if (addButton) addToCart(Number(addButton.dataset.add), 1);\n\n  const dealButton = event.target.closest(\"[data-deal]\");\n  if (dealButton) addDealToCart(dealButton.dataset.deal);\n\n  const reorderButton = event.target.closest(\"[data-reorder]\");\n  if (reorderButton && reorderOrder(reorderButton.dataset.reorder)) {\n    window.parent.__go(\"cart.html\");\n  }\n});\n\n<\/script>\n  <script>\n// checkout.js - Checkout: pickup or delivery, payment, place order\n\nconst checkoutBox = document.getElementById(\"checkoutContent\");\nconst groups = getCartGroups();        // the cart split by canteen (one order per canteen)\nconst pricing = getCartPricing();\n\n// Next order number: 1024, 1025, ... (the counter is saved in localStorage)\nfunction nextOrderNumber() {\n  const number = load(KEYS.lastNumber, 1023) + 1;\n  save(KEYS.lastNumber, number);\n  return number;\n}\n\n// Random 4-digit code, e.g. 4821 (used as pickup code and as delivery OTP)\nfunction randomCode() {\n  return String(Math.floor(1000 + Math.random() * 9000));\n}\n\n// Which radio button is selected? e.g. selectedValue(\"payment\")\nfunction selectedValue(name) {\n  return document.querySelector('input[name=\"' + name + '\"]:checked').value;\n}\n\nfunction renderCheckout() {\n  if (groups.length === 0) {\n    checkoutBox.innerHTML = `\n      <div class=\"empty\">\n        <div class=\"empty-emoji\">\ud83d\uded2<\/div>\n        <h2>Nothing to check out<\/h2>\n        <p class=\"muted\">Your cart is empty. Add some food first.<\/p>\n        <a class=\"btn\" href=\"menu.html\">Browse Menu<\/a>\n      <\/div>`;\n    return;\n  }\n\n  const many = groups.length > 1;\n  const canteenNames = groups.map(function (g) { return g.canteen; }).join(\" + \");\n\n  // Order summary: one block per canteen\n  const lines = groups.map(function (g) {\n    return (many ? '<p class=\"summary-canteen\">' + g.canteen + \"<\/p>\" : \"\") +\n      g.items.map(function (item) {\n        return `<div class=\"summary-row\"><span>${item.food.name} \u00d7 ${item.qty}<\/span><span>${rupees(item.food.price * item.qty)}<\/span><\/div>`;\n      }).join(\"\");\n  }).join(\"\");\n\n  const dealLines = pricing.applied.map(function (a) {\n    return `<div class=\"summary-row saving\"><span>Deal: ${a.deal.name}${a.times > 1 ? \" \u00d7 \" + a.times : \"\"}<\/span><span>-${rupees(a.saving)}<\/span><\/div>`;\n  }).join(\"\");\n\n  checkoutBox.innerHTML = `\n    <form id=\"checkoutForm\" class=\"two-col\">\n      <div>\n        <section class=\"form-card\">\n          <h2>How do you want your food?<\/h2>\n          <div class=\"options\">\n            <label class=\"option\"><input type=\"radio\" name=\"mode\" value=\"pickup\" checked> Pick up from ${canteenNames}<\/label>\n            <label class=\"option\"><input type=\"radio\" name=\"mode\" value=\"delivery\"> Deliver to me on campus (+${rupees(DELIVERY_FEE)}${many ? \" per canteen\" : \"\"})<\/label>\n          <\/div>\n\n          <div class=\"sub-field\" id=\"pickupFields\">\n            <div class=\"options\">\n              <label class=\"option\"><input type=\"radio\" name=\"pickup\" value=\"now\" checked> Pick up now<\/label>\n              <label class=\"option\"><input type=\"radio\" name=\"pickup\" value=\"later\"> Pick up later<\/label>\n            <\/div>\n            <div class=\"sub-field\" id=\"laterField\" hidden>\n              <label for=\"laterTime\">Pick up in<\/label>\n              <select id=\"laterTime\" class=\"select-input\">\n                <option>30 minutes<\/option>\n                <option>1 hour<\/option>\n                <option>2 hours<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n\n          <div class=\"sub-field\" id=\"deliveryFields\" hidden>\n            <label for=\"spot\">Deliver to<\/label>\n            <select id=\"spot\" class=\"select-input\">\n              ${campusSpots.map(function (s) { return \"<option>\" + s.name + \"<\/option>\"; }).join(\"\")}\n            <\/select>\n            <div class=\"sub-field\">\n              <label for=\"note\">Room / block / landmark (optional)<\/label>\n              <input type=\"text\" id=\"note\" class=\"text-input\" maxlength=\"60\" placeholder=\"e.g. Room 214, near the front gate\">\n            <\/div>\n            <p class=\"muted\" style=\"margin-top:0.7rem\">You'll get a 4-digit delivery OTP. Share it with the rider only when you receive your food.<\/p>\n          <\/div>\n        <\/section>\n\n        <section class=\"form-card\">\n          <h2>Payment<\/h2>\n          <div class=\"options\">\n            <label class=\"option\"><input type=\"radio\" name=\"payment\" value=\"cash\" checked> <span id=\"cashLabel\">Cash at pickup<\/span><\/label>\n            <label class=\"option\"><input type=\"radio\" name=\"payment\" value=\"upi\"> UPI (Demo only)<\/label>\n          <\/div>\n          <p class=\"muted\" id=\"upiNote\" style=\"margin-top:0.7rem\" hidden>Demo only: no real payment is made.<\/p>\n        <\/section>\n      <\/div>\n\n      <aside class=\"summary\">\n        <h2>Order Summary<\/h2>\n        ${lines}\n        ${many ? '<p class=\"muted note\">You will get ' + groups.length + \" separate orders, one per canteen.<\/p>\" : '<div class=\"summary-row\"><span>Canteen<\/span><strong>' + canteenNames + \"<\/strong><\/div>\"}\n        ${pricing.discount > 0 ? '<div class=\"summary-row\"><span>Subtotal<\/span><span>' + rupees(pricing.subtotal) + \"<\/span><\/div>\" : \"\"}\n        ${dealLines}\n        <div class=\"summary-row\" id=\"feeRow\" hidden><span>Delivery fee${many ? \" (\" + groups.length + \" \u00d7 \" + rupees(DELIVERY_FEE) + \")\" : \"\"}<\/span><span>${rupees(DELIVERY_FEE * groups.length)}<\/span><\/div>\n        <div class=\"summary-row summary-total\"><span>Total<\/span><span id=\"totalValue\">${rupees(pricing.total)}<\/span><\/div>\n        <button type=\"submit\" class=\"btn btn-block\">Place Order<\/button>\n        <p class=\"muted note\">After you pay you get 2 minutes to add extra items.<\/p>\n        <p class=\"note\"><a class=\"link-btn\" href=\"cart.html\">Back to cart<\/a><\/p>\n      <\/aside>\n    <\/form>`;\n\n  const form = document.getElementById(\"checkoutForm\");\n\n  // Show/hide fields and update the total when something changes\n  form.addEventListener(\"change\", function () {\n    const delivery = selectedValue(\"mode\") === \"delivery\";\n    document.getElementById(\"pickupFields\").hidden = delivery;\n    document.getElementById(\"deliveryFields\").hidden = !delivery;\n    document.getElementById(\"feeRow\").hidden = !delivery;\n    document.getElementById(\"cashLabel\").textContent = delivery ? \"Cash on delivery\" : \"Cash at pickup\";\n    document.getElementById(\"laterField\").hidden = selectedValue(\"pickup\") !== \"later\";\n    document.getElementById(\"upiNote\").hidden = selectedValue(\"payment\") !== \"upi\";\n    document.getElementById(\"totalValue\").textContent = rupees(pricing.total + (delivery ? DELIVERY_FEE * groups.length : 0));\n  });\n\n  form.addEventListener(\"submit\", placeOrder);\n}\n\nfunction placeOrder(event) {\n  event.preventDefault();\n\n  // Safety check: a canteen may have marked something Sold Out in the meantime\n  const soldOut = getCartItems().filter(function (item) { return !isAvailable(item.food); });\n  if (soldOut.length > 0) {\n    alert(soldOut[0].food.name + \" just sold out. Please remove it from your cart.\");\n    window.parent.__go(\"cart.html\");\n    return;\n  }\n\n  const delivery = selectedValue(\"mode\") === \"delivery\";\n  const spot = delivery ? document.getElementById(\"spot\").value : null;\n  const note = delivery ? document.getElementById(\"note\").value.trim() : \"\";\n  const fee = delivery ? DELIVERY_FEE : 0;\n  const now = Date.now();\n\n  const pickupText = selectedValue(\"pickup\") === \"later\"\n    ? \"Pick up later (in \" + document.getElementById(\"laterTime\").value + \")\"\n    : \"Pick up now\";\n\n  const paymentText = selectedValue(\"payment\") === \"upi\"\n    ? \"UPI (Demo)\"\n    : (delivery ? \"Cash on delivery\" : \"Cash at pickup\");\n\n  const orders = getOrders();\n  const newIds = [];\n\n  // One order for each canteen in the cart\n  groups.forEach(function (group) {\n    const number = nextOrderNumber();\n    const order = {\n      id: \"CB\" + number,\n      canteen: group.canteen,\n      mode: delivery ? \"delivery\" : \"pickup\",\n      items: group.items.map(function (item) {\n        return { id: item.food.id, name: item.food.name, price: item.food.price, qty: item.qty };\n      }),\n      subtotal: group.pricing.subtotal,\n      discount: group.pricing.discount,\n      deals: group.pricing.applied.map(function (a) { return a.deal.name + (a.times > 1 ? \" \u00d7 \" + a.times : \"\"); }),\n      deliveryFee: fee,\n      total: group.pricing.total + fee,\n      date: new Date(now).toISOString(),\n      placedAt: now,\n      addonUntil: now + ADDON_WINDOW_SECONDS * 1000,   // the 2-minute add-on window\n      status: \"Order Placed\",\n      accepted: false,\n      pickupOption: delivery ? \"Delivery to \" + spot : pickupText,\n      payment: paymentText,\n      pickupCode: delivery ? null : randomCode(),\n      deliveryOtp: delivery ? randomCode() : null,\n      deliverTo: spot,\n      deliveryNote: note,\n      riderId: delivery ? riders[number % riders.length].id : null,\n      outAt: null,\n      deliveredAt: null,\n      addOns: []\n    };\n    orders.push(order);\n    newIds.push(order.id);\n  });\n\n  saveOrders(orders);   // save the orders\n  saveCart([]);         // empty the cart\n\n  window.parent.__go(\"confirmation.html?id=\" + newIds.join(\",\"));\n}\n\nrenderCheckout();\n\n<\/script>\n<\/body>\n<\/html>\n", "confirmation.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Order Placed - CampusBite<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n  <style>\n/* =====================================================\n   style.css  -  CampusBite\n   Theme: cream + orange + dark brown\n   ===================================================== */\n\n:root {\n  --cream: #FFF7EB;\n  --card: #FFFFFF;\n  --orange: #FF8A2A;\n  --orange-deep: #E8700F;\n  --orange-text: #B84A06;   /* orange that is readable on cream */\n  --brown: #2E1B12;\n  --muted: #7A6455;\n  --line: #EFDFCB;\n  --green: #2E9B4F;\n  --red: #D6362B;\n  --shadow: 0 8px 24px rgba(46, 27, 18, 0.07);\n  --shadow-lg: 0 18px 40px rgba(46, 27, 18, 0.14);\n  --font-head: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;\n  --font-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;\n}\n\n/* ---------- Base ---------- */\n[hidden] { display: none !important; }\n*, *::before, *::after { box-sizing: border-box; }\nbody, h1, h2, h3, p, ul, ol { margin: 0; }\nul, ol { padding: 0; list-style: none; }\n\nbody {\n  font-family: var(--font-body);\n  background:\n    radial-gradient(520px circle at 0% 0%, #FFE6C4 0%, transparent 70%),\n    radial-gradient(600px circle at 100% 35%, #FFE3C2 0%, transparent 70%),\n    var(--cream);\n  background-attachment: fixed;\n  color: var(--brown);\n  line-height: 1.55;\n  min-height: 100vh;\n  display: flex;\n  flex-direction: column;\n}\nmain { flex: 1; }\na { color: inherit; text-decoration: none; }\nbutton, input, select { font-family: inherit; }\n\nh1, h2, h3 { font-family: var(--font-head); line-height: 1.15; letter-spacing: -0.01em; }\nh1 { font-size: clamp(2.3rem, 5.5vw, 3.8rem); font-weight: 800; }\nh2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; }\nh3 { font-size: 1.1rem; font-weight: 700; }\n\n.muted { color: var(--muted); }\n.container { width: min(1100px, 100% - 2rem); margin-inline: auto; }\n.page { padding: 2rem 0 3.5rem; }\n.page-sub { color: var(--muted); margin: 0.4rem 0 1.6rem; }\n.section { padding: 2.5rem 0 0; }\n.section h2 { margin-bottom: 1.2rem; }\n.page > h1 { font-size: clamp(2.4rem, 5vw, 3.4rem); }\n\n:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }\n::selection { background: var(--orange); color: var(--brown); }\nhtml { scroll-behavior: smooth; }\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-block;\n  border: 2px solid var(--orange);\n  background: var(--orange);\n  color: var(--brown);\n  font: 700 1rem var(--font-body);\n  padding: 0.7rem 1.5rem;\n  border-radius: 999px;\n  cursor: pointer;\n  text-align: center;\n  box-shadow: 0 4px 0 #C9600A;\n  transition: transform 0.12s, box-shadow 0.12s, background 0.15s;\n}\n.btn:hover { background: #FF9840; border-color: #FF9840; transform: translateY(-2px); box-shadow: 0 6px 0 #C9600A; }\n.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #C9600A; }\n.btn-outline { background: transparent; color: var(--orange-text); border-color: var(--orange); box-shadow: none; }\n.btn-outline:hover { background: var(--orange); color: var(--brown); box-shadow: 0 4px 0 #C9600A; }\n.btn-small { padding: 0.45rem 1rem; font-size: 0.9rem; }\n.btn:disabled, .btn.is-disabled {\n  background: #E9DDCF; border-color: #E9DDCF; color: #85705F; cursor: not-allowed; transform: none; box-shadow: none;\n}\n.btn.is-current { background: var(--brown); border-color: var(--brown); color: #fff; opacity: 1; box-shadow: none; }\n.btn-block { display: block; width: 100%; }\n.link-btn { background: none; border: none; color: var(--orange-text); font-weight: 700; cursor: pointer; padding: 0; font-size: 0.9rem; }\n.link-btn:hover { text-decoration: underline; }\n\n.chip {\n  display: inline-block; background: #FFE7CC; color: #6F3200;\n  padding: 0.2rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 700;\n}\n.status-0 { background: #FFF0B8; color: #5F4800; }\n.status-1 { background: #FFDDB8; color: #6F3200; }\n.status-2 { background: #CDEFD3; color: #14532D; }\n.status-3 { background: #E6DDF8; color: #3B2A6B; }   /* Out for Delivery */\n.status-4 { background: #CFE4FA; color: #0C3B6B; }   /* Completed / Delivered */\n\n/* ---------- Navbar ---------- */\n.navbar { color: var(--cream); position: sticky; top: 0; z-index: 20; padding-top: 0.8rem; }\n.nav-inner {\n  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;\n  background: var(--brown); border-radius: 999px; padding: 0.5rem 0.55rem 0.5rem 1.5rem;\n  box-shadow: 0 10px 28px rgba(46, 27, 18, 0.25);\n}\n.brand { font-family: var(--font-head); font-weight: 800; font-size: 1.4rem; color: var(--orange); }\n.nav-links { display: flex; gap: 0.3rem; align-items: center; }\n.nav-links a { padding: 0.45rem 0.8rem; border-radius: 999px; font-weight: 500; color: #F6E6D2; }\n.nav-links a:hover { background: rgba(255, 255, 255, 0.1); }\n.nav-links a.active { background: var(--orange); color: var(--brown); font-weight: 700; }\n.cart-badge {\n  display: none; margin-left: 0.4rem; background: var(--orange); color: var(--brown);\n  font-size: 0.75rem; font-weight: 800; min-width: 1.4rem; height: 1.4rem; line-height: 1.4rem;\n  text-align: center; border-radius: 999px; padding: 0 0.3rem;\n}\n.nav-links a.active .cart-badge { background: var(--brown); color: var(--orange); }\n.nav-toggle {\n  display: none; background: none; border: 2px solid #6B4A38; color: var(--cream);\n  font-size: 1.3rem; border-radius: 10px; padding: 0.1rem 0.7rem; cursor: pointer;\n}\n\n/* ---------- Hero (home) ---------- */\n.hero { position: relative; overflow: hidden; padding: 4rem 0 2rem; }\n.hero::before, .hero::after { position: absolute; pointer-events: none; opacity: 0.13; }\n.hero::before { content: \"\ud83c\udf55\"; font-size: 9rem; left: -1%; bottom: -3%; transform: rotate(-16deg); }\n.hero::after { content: \"\ud83c\udf69\"; font-size: 4.5rem; left: 52%; top: 5%; transform: rotate(14deg); }\n.hero-inner { position: relative; z-index: 0; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 3rem; align-items: center; }\n.hero-inner::before {\n  content: \"\"; position: absolute; z-index: -1; right: -2%; top: 50%; width: 400px; height: 400px; max-width: 90%;\n  border-radius: 50%; background: #FFD9A8; transform: translateY(-50%);\n}\n.hero h1 { font-size: clamp(2.7rem, 6.5vw, 4.7rem); line-height: 1.02; }\n.hero p.lead { font-size: 1.15rem; color: var(--muted); margin: 1rem 0 1.6rem; max-width: 34rem; }\n.search-bar {\n  display: flex; gap: 0.4rem; background: #fff; border: 2px solid var(--line);\n  border-radius: 999px; padding: 0.4rem; max-width: 36rem; box-shadow: var(--shadow-lg); border-color: #fff;\n}\n.search-bar input { flex: 1; border: none; outline: none; padding: 0.5rem 1rem; font-size: 1rem; background: transparent; min-width: 0; }\n.search-bar:focus-within { border-color: var(--orange); }\n\n/* The pickup ticket - the one memorable element on the home page */\n.ticket {\n  background: var(--orange); border-radius: 22px; transform: rotate(-3deg);\n  box-shadow: 0 18px 40px rgba(46, 27, 18, 0.22); max-width: 340px; margin-inline: auto;\n  animation: ticket-in 0.7s ease-out;\n}\n.ticket-top { padding: 1.4rem 1.5rem 1.2rem; }\n.ticket-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }\n.ticket-row strong { font-family: var(--font-head); font-size: 1.3rem; }\n.ticket-top ul { margin: 0.8rem 0; line-height: 1.8; }\n.ticket-bottom { position: relative; border-top: 3px dashed rgba(46, 27, 18, 0.45); padding: 1.1rem 1.5rem 0.6rem; text-align: center; }\n.ticket-bottom::before, .ticket-bottom::after {\n  content: \"\"; position: absolute; top: -15px; width: 28px; height: 28px; border-radius: 50%; background: var(--cream);\n}\n.ticket-bottom::before { left: -14px; }\n.ticket-bottom::after { right: -14px; }\n.ticket-code { font-family: var(--font-head); font-weight: 800; font-size: 3rem; letter-spacing: 0.2em; line-height: 1.2; padding-left: 0.2em; }\n.ticket::after {\n  content: \"\"; display: block; height: 36px; margin: 0.4rem 1.5rem 1.4rem; opacity: 0.85;\n  background: repeating-linear-gradient(90deg, var(--brown) 0 2px, transparent 2px 5px, var(--brown) 5px 6px, transparent 6px 9px, var(--brown) 9px 12px, transparent 12px 14px);\n}\n@keyframes ticket-in { from { opacity: 0; transform: translateY(24px) rotate(-8deg); } to { opacity: 1; transform: rotate(-3deg); } }\n\n/* ---------- Grids + canteen cards ---------- */\n.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.3rem; }\n.canteen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.3rem; }\n.canteen-card {\n  background: var(--card); border-radius: 22px; padding: 1.6rem; box-shadow: var(--shadow);\n  display: flex; flex-direction: column; gap: 0.7rem; align-items: flex-start;\n  transition: transform 0.2s, box-shadow 0.2s;\n}\n.canteen-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(46, 27, 18, 0.14); }\n.canteen-card .emoji {\n  width: 76px; height: 76px; border-radius: 50%; background: #fff; display: grid; place-items: center;\n  font-size: 2.3rem; line-height: 1; box-shadow: 0 8px 18px rgba(46, 27, 18, 0.12);\n}\n.canteen-card p { color: var(--muted); flex: 1; }\n.canteen-card:nth-child(1) { background: #FFEFC6; }\n.canteen-card:nth-child(2) { background: #FFDCC2; }\n.canteen-card:nth-child(3) { background: #F6E4CB; }\n.canteen-card .chip { background: #fff; }\n\n/* ---------- Food cards ---------- */\n.food-card {\n  background: var(--card); border-radius: 26px; overflow: hidden; box-shadow: var(--shadow);\n  display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s;\n}\n.food-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }\n.food-img {\n  position: relative; isolation: isolate; display: flex; align-items: center; justify-content: center;\n  height: 165px; font-size: 3.8rem; margin: 0.55rem 0.55rem 0; border-radius: 20px;\n}\n.food-img::before, .detail-img::before {\n  content: \"\"; position: absolute; z-index: -1; width: 118px; height: 118px; border-radius: 50%;\n  background: rgba(255, 255, 255, 0.8);\n  box-shadow: inset 0 0 0 7px rgba(255, 255, 255, 0.95), 0 12px 24px rgba(46, 27, 18, 0.14);\n  transition: transform 0.25s;\n}\n.detail-img::before { width: 250px; height: 250px; box-shadow: inset 0 0 0 12px #fff, 0 20px 40px rgba(46, 27, 18, 0.16); }\n.food-card:hover .food-img::before { transform: scale(1.07); }\n.tile-udupi { background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.7), transparent 55%), #FFE3A3; }\n.tile-tango { background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.6), transparent 55%), #FFC9A6; }\n.tile-munch { background: radial-gradient(circle at 25% 15%, rgba(255, 255, 255, 0.6), transparent 55%), #F2D9BA; }\n.food-img span { transition: transform 0.25s; }\n.food-card:hover .food-img span { transform: scale(1.12) rotate(-4deg); }\n.sold-badge {\n  position: absolute; top: 10px; left: 10px; background: var(--brown); color: #fff;\n  font-style: normal; font-weight: 700; font-size: 0.8rem; padding: 0.2rem 0.75rem; border-radius: 999px;\n}\n.is-sold-out .food-img span { filter: grayscale(1); opacity: 0.45; }\n.food-body { padding: 1rem 1.1rem 1.2rem; display: flex; flex-direction: column; gap: 0.2rem; flex: 1; }\n.food-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }\n.food-top a:hover { color: var(--orange-text); }\n.food-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 0.8rem; }\n.price { font-family: var(--font-head); font-size: 1.25rem; }\n\n.veg-dot {\n  width: 17px; height: 17px; border: 2px solid var(--green); border-radius: 3px; flex: none; background: #fff;\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.veg-dot::after { content: \"\"; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }\n.veg-dot.nonveg { border-color: var(--red); }\n.veg-dot.nonveg::after { background: var(--red); }\n\n/* ---------- Menu filters ---------- */\n.filters { background: var(--card); border-radius: 20px; padding: 1.3rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; display: grid; gap: 1.1rem; }\n.filter-group h3 { font-size: 0.95rem; margin-bottom: 0.55rem; }\n.pill-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }\n.pill {\n  border: 2px solid var(--line); background: #fff; color: var(--brown);\n  font: 600 0.92rem var(--font-body); padding: 0.35rem 1rem; border-radius: 999px; cursor: pointer;\n}\n.pill:hover { border-color: var(--orange); }\n.pill.active { background: var(--brown); border-color: var(--brown); color: #fff; }\n.text-input, .select-input {\n  width: 100%; padding: 0.7rem 1rem; border: 2px solid var(--line); border-radius: 12px; font-size: 1rem; background: #fff; color: var(--brown);\n}\n.text-input:focus, .select-input:focus { border-color: var(--orange); outline: none; }\n.result-info { margin-bottom: 1rem; color: var(--muted); font-weight: 500; }\n\n/* ---------- Empty states ---------- */\n.empty { text-align: center; padding: 3rem 1rem; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); grid-column: 1 / -1; }\n.empty-emoji { font-size: 3.2rem; }\n.empty h2 { margin: 0.5rem 0; }\n.empty p { margin-bottom: 1.2rem; }\n\n/* ---------- Food details ---------- */\n.back-link { display: inline-block; margin-bottom: 1rem; color: var(--orange-text); font-weight: 700; }\n.back-link:hover { text-decoration: underline; }\n.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; background: var(--card); border-radius: 26px; padding: 1.5rem; box-shadow: var(--shadow); }\n.detail-img { position: relative; isolation: isolate; display: flex; align-items: center; justify-content: center; border-radius: 20px; font-size: 8rem; min-height: 320px; }\n.detail-info { display: flex; flex-direction: column; gap: 0.9rem; justify-content: center; }\n.detail-title { display: flex; align-items: center; gap: 0.7rem; }\n.facts { display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 1.2rem; }\n.facts dt { color: var(--muted); }\n.facts dd { margin: 0; font-weight: 700; }\n.detail-price { font-family: var(--font-head); font-size: 2rem; font-weight: 800; }\n.detail-actions { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; }\n\n.stepper { display: inline-flex; align-items: center; gap: 0.2rem; border: 2px solid var(--line); border-radius: 999px; padding: 0.15rem; background: #fff; }\n.stepper button { width: 34px; height: 34px; border: none; border-radius: 50%; background: var(--cream); font-size: 1.2rem; font-weight: 700; cursor: pointer; color: var(--brown); }\n.stepper button:hover:not(:disabled) { background: var(--orange); }\n.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }\n.stepper span { min-width: 2.1rem; text-align: center; font-weight: 700; }\n\n/* ---------- Cart + Checkout ---------- */\n.two-col { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; align-items: start; }\n.cart-row {\n  display: grid; grid-template-columns: 64px 1fr auto 90px; gap: 1rem; align-items: center;\n  padding: 1rem; background: var(--card); border-radius: 18px; margin-bottom: 0.8rem; box-shadow: var(--shadow);\n}\n.cart-thumb { width: 64px; height: 64px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }\n.cart-sub { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 0.2rem; }\n.warn { color: var(--red); font-weight: 700; font-size: 0.9rem; }\n.summary { background: var(--card); border-radius: 22px; padding: 1.4rem; box-shadow: var(--shadow); position: sticky; top: 5rem; }\n.summary h2 { font-size: 1.3rem; margin-bottom: 0.8rem; }\n.summary-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.3rem 0; }\n.summary-total { border-top: 2px dashed var(--line); margin-top: 0.6rem; padding-top: 0.9rem; font-size: 1.3rem; font-weight: 800; font-family: var(--font-head); }\n.summary .btn { margin-top: 1.1rem; }\n.summary .note { margin-top: 0.7rem; font-size: 0.9rem; }\n\n.form-card { background: var(--card); border-radius: 22px; padding: 1.4rem; box-shadow: var(--shadow); margin-bottom: 1.2rem; }\n.form-card h2 { font-size: 1.25rem; margin-bottom: 0.9rem; }\n.options { display: grid; gap: 0.6rem; }\n.option {\n  display: flex; gap: 0.7rem; align-items: center; border: 2px solid var(--line);\n  border-radius: 14px; padding: 0.8rem 1rem; cursor: pointer; background: #fff; font-weight: 500;\n}\n.option input { accent-color: var(--orange-deep); width: 18px; height: 18px; }\n.option:has(input:checked) { border-color: var(--orange); background: #FFF1E0; }\n.sub-field { margin-top: 0.8rem; }\n.sub-field label { display: block; font-weight: 700; margin-bottom: 0.3rem; }\n\n/* ---------- Order confirmation ---------- */\n.confirm {\n  position: relative; overflow: hidden; max-width: 520px; margin: 1rem auto 0; background: var(--card);\n  border-radius: 28px; padding: 3rem 1.6rem 2.2rem; box-shadow: var(--shadow-lg); text-align: center;\n}\n.confirm::before {\n  content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 14px;\n  background: repeating-linear-gradient(90deg, var(--orange) 0 22px, var(--brown) 22px 44px);\n}\n.confirm h1 { font-size: clamp(2rem, 5vw, 2.6rem); margin-bottom: 1.2rem; }\n.confirm .facts { text-align: left; max-width: 340px; margin: 0 auto 1.4rem; }\n.pickup-code {\n  display: inline-block; background: var(--orange); border-radius: 18px; padding: 0.4rem 1.2rem 0.4rem 1.5rem;\n  font-family: var(--font-head); font-weight: 800; font-size: 3.2rem; letter-spacing: 0.3em; margin: 0.3rem 0 0.8rem; box-shadow: 0 5px 0 #C9600A;\n}\n.confirm .btn { margin-top: 1.3rem; }\n\n/* ---------- My Orders + Dashboard orders ---------- */\n.order-card { background: var(--card); border-radius: 24px; padding: 1.3rem 1.5rem; box-shadow: var(--shadow); margin-bottom: 1rem; border: 1px solid rgba(46, 27, 18, 0.05); }\n.order-card.is-done { opacity: 0.7; }\n.order-head { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; flex-wrap: wrap; }\n.order-meta { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; font-size: 0.9rem; color: var(--muted); margin: 0.3rem 0 0.7rem; }\n.order-items li { padding: 0.1rem 0; }\n.order-foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 2px dashed var(--line); }\n.order-foot strong { font-family: var(--font-head); font-size: 1.25rem; }\n.code-tag { background: var(--cream); border: 2px dashed var(--orange); padding: 0.15rem 0.7rem; border-radius: 10px; font-weight: 800; letter-spacing: 0.15em; }\n.accepted-note { color: var(--green); font-weight: 700; font-size: 0.9rem; margin-top: 0.6rem; }\n\n.tracker { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.4rem; margin-top: 1rem; }\n.tracker li { font-size: 0.8rem; color: var(--muted); text-align: center; }\n.tracker li::before { content: \"\"; display: block; height: 6px; border-radius: 99px; background: var(--line); margin-bottom: 0.4rem; }\n.tracker li.done::before { background: var(--orange); }\n.tracker li.current::before { background: var(--brown); }\n.tracker li.current { color: var(--brown); font-weight: 700; }\n\n/* ---------- Dashboard ---------- */\n.dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }\n.dash-select label { display: block; font-weight: 700; margin-bottom: 0.3rem; }\n.dash-select select { min-width: 200px; }\n.dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.5rem; align-items: start; }\n.dash-grid h2 { font-size: 1.35rem; margin-bottom: 0.3rem; }\n.btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.9rem; }\n.avail-card { background: var(--card); border-radius: 20px; padding: 1.2rem 1.4rem; box-shadow: var(--shadow); margin-top: 0.8rem; }\n.avail-row { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line); }\n.avail-row:last-child { border-bottom: none; }\n.toggle-btn { border: 2px solid; border-radius: 999px; padding: 0.3rem 0.9rem; font: 700 0.88rem var(--font-body); cursor: pointer; white-space: nowrap; }\n.toggle-btn.on { background: #DDF3E2; border-color: #9ED6AB; color: #14532D; }\n.toggle-btn.off { background: #FBE0DD; border-color: #EDA9A2; color: #8A1C13; }\n.reset-row { margin-top: 2rem; text-align: center; }\n\n/* ---------- About ---------- */\n.about-intro { font-size: 1.15rem; max-width: 42rem; margin: 0.8rem 0 1.6rem; }\n.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.3rem; }\n.about-card { background: var(--card); border-radius: 22px; padding: 1.6rem; box-shadow: var(--shadow); }\n.about-card h2 { font-size: 1.3rem; margin-bottom: 0.7rem; }\n.tick-list li { padding: 0.25rem 0 0.25rem 1.6rem; position: relative; }\n.tick-list li::before { content: \"\u2713\"; position: absolute; left: 0; color: var(--orange-text); font-weight: 800; }\n\n/* ---------- Footer + toast ---------- */\n.footer { background: var(--brown); color: #F6E6D2; margin-top: 3rem; border-radius: 36px 36px 0 0; }\n.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.2rem 0; flex-wrap: wrap; }\n.footer-links { display: flex; gap: 1.2rem; flex-wrap: wrap; }\n.footer a { color: var(--orange); font-weight: 700; }\n.footer a:hover { text-decoration: underline; }\n.toast {\n  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--brown); color: #fff;\n  padding: 0.75rem 1.4rem; border-radius: 999px; font-weight: 600; opacity: 0; pointer-events: none;\n  transition: opacity 0.25s, transform 0.25s; z-index: 50; max-width: calc(100% - 2rem); text-align: center;\n}\n.toast.show { opacity: 1; transform: translate(-50%, 0); }\n\n/* ---------- Tablet ---------- */\n@media (max-width: 860px) {\n  .hero-inner, .detail, .two-col, .dash-grid, .about-grid { grid-template-columns: 1fr; }\n  .hero { padding-top: 1.5rem; }\n  .hero-inner::before { top: auto; bottom: -20px; right: 50%; transform: translateX(50%); width: 320px; height: 320px; }\n  .ticket { margin-top: 0.5rem; }\n  .canteen-grid { grid-template-columns: 1fr; }\n  .summary { position: static; }\n  .detail-img { min-height: 220px; font-size: 6rem; }\n  .detail-img::before { width: 190px; height: 190px; }\n\n  .nav-toggle { display: block; }\n  .nav-inner { border-radius: 28px; padding: 0.5rem 0.6rem 0.5rem 1.2rem; }\n  .nav-links { display: none; flex-direction: column; align-items: stretch; width: 100%; padding-bottom: 0.6rem; }\n  .nav-links.open { display: flex; }\n}\n\n/* ---------- Mobile ---------- */\n@media (max-width: 600px) {\n  .grid { grid-template-columns: 1fr; }\n  .pill-row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 0.3rem; scrollbar-width: none; }\n  .pill { flex: none; }\n  .cart-row { grid-template-columns: 56px 1fr; }\n  .cart-thumb { width: 56px; height: 56px; font-size: 1.7rem; }\n  .cart-row .stepper { grid-column: 2; justify-self: start; }\n  .cart-sub { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }\n  .tracker li { font-size: 0.72rem; }\n  .search-bar .btn { padding: 0.6rem 1rem; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n}\n\n\n/* =====================================================\n   NEW FEATURES: picks, reorder, history, deals, add-ons, delivery\n   ===================================================== */\n\n/* ---------- \"Why we picked it\" tag + home sections ---------- */\n.reason {\n  display: inline-block; width: fit-content; margin-top: 0.2rem; background: #FFF1E0; color: var(--orange-text);\n  font-size: 0.8rem; font-weight: 700; padding: 0.15rem 0.65rem; border-radius: 999px;\n}\n.section-note { margin: -0.6rem 0 1.2rem; }\n.again-row { display: grid; grid-templ
