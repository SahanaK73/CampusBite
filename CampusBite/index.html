<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - CampusBite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="container hero-inner">
        <div>
          <h1>Hungry? Skip the queue. 🍔</h1>
          <p class="lead">Order your favourite food from your campus canteens and pick it up when it's ready.</p>
          <form class="search-bar" id="heroSearch" role="search">
            <input type="text" id="heroInput" placeholder="Search for food..." aria-label="Search for food">
            <button class="btn" type="submit">Search</button>
          </form>
        </div>

        <!-- Sample pickup ticket (decoration only) -->
        <div class="ticket" aria-hidden="true">
          <div class="ticket-top">
            <div class="ticket-row"><strong>Udupi</strong><span>#CB1024</span></div>
            <ul>
              <li>Masala Dosa × 2</li>
              <li>Lemon Tea × 1</li>
            </ul>
            <div class="ticket-row"><span>Total</span><strong>₹115</strong></div>
          </div>
          <div class="ticket-bottom">
            <p>Pickup code</p>
            <div class="ticket-code">4821</div>
            <p>🟢 Ready for Pickup</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Canteens -->
    <section class="container section">
      <h2>Our Canteens</h2>
      <div class="canteen-grid" id="canteenList"></div>
    </section>

    <!-- Order again (only shown once the student has orders) -->
    <section class="container section" id="againSection" hidden>
      <h2>Order again</h2>
      <div class="again-row" id="againList"></div>
    </section>

    <!-- Picked for you -->
    <section class="container section">
      <h2>✨ Picked for you</h2>
      <p class="muted section-note" id="recoNote"></p>
      <div class="grid" id="recoList"></div>
    </section>

    <!-- Popular foods -->
    <section class="container section">
      <h2>🔥 Popular Foods</h2>
      <div class="grid" id="popularList"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
